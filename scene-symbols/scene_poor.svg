<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Poor</title>
  <desc>Two empty pocket linings pulled inside out at the sides of a pair of blue jeans.</desc>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- A close-up of the waistband and legs keeps the pockets large on the button. -->
    <path d="M26 15 Q50 19 74 15 L79 50 75 93 H56 L50 65 45 93 H25 L21 50Z"
          fill="#467ba5" stroke="#263e56" stroke-width="3"/>
    <path d="M26 15 Q50 19 74 15 L75 24 Q50 28 25 24Z" fill="#305878" stroke="#263e56" stroke-width="2"/>
    <path d="M36 16v9m28-9v9" stroke="#92b2c8" stroke-width="4"/>
    <circle cx="50" cy="21" r="2.6" fill="#ffd27d"/>
    <path d="M54 30v11q0 7-5 9" fill="none" stroke="#243e57" stroke-width="2.5"/>

    <!-- The pale fabric hangs outside each dark pocket opening. -->
    <g id="lining">
      <path d="M36 29Q31 45 21 48" fill="none" stroke="#20394f" stroke-width="5"/>
      <path d="M35 30Q26 37 10 35Q4 35 4 42Q4 53 12 60Q17 65 23 59Q31 51 35 30Z"
            fill="#fff5df" stroke="#514c47" stroke-width="3"/>
      <path d="M10 40q9 3 16-1M13 55q3 3 5 2" fill="none" stroke="#baa98e" stroke-width="2"/>
    </g>
    <use href="#lining" transform="translate(100 0) scale(-1 1)"/>
  </g>
</svg>
