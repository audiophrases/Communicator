<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Possible</title>
  <desc>A door stands wide open. A green arrow leads through the opening to a sunny path.</desc>

  <!-- The landscape is visible through the entire doorway. -->
  <rect x="24" y="15" width="44" height="58" fill="#c6edfb"/>
  <circle cx="39" cy="29" r="6" fill="#ffbd42"/>
  <path d="M24 51q12-14 23-6t21-1v29H24Z" fill="#75ac6b"/>
  <path d="M46 48h3l12 25H34Z" fill="#fff0c5"/>
  <path d="M22 74V13h48v61" fill="none" stroke="#364d59" stroke-width="6" stroke-linejoin="round"/>

  <!-- The door leaf is outside the frame, hinged on the right. -->
  <path d="m70 14 19-9v78l-19-10Z" fill="#e79a55" stroke="#783f23" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="m75 25 9-4v18l-9 2Z" fill="#ffca86"/>
  <ellipse cx="84" cy="52" rx="2.5" ry="3.2" fill="#553723"/>

  <path d="M8 94q24-4 38-25" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <path d="M8 94q24-4 38-25" fill="none" stroke="#17764f" stroke-width="7" stroke-linecap="round"/>
  <path d="m35 66 18-7-3 20Z" fill="#17764f" stroke="#17764f" stroke-width="2" stroke-linejoin="round"/>
</svg>
