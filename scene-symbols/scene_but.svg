  <ellipse cx="74.5" cy="39" rx="15" ry="4" fill="#acced2" stroke="#466777" stroke-width="2.5"/>
  <path d="M60 62v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect x="64" y="21" width="31" height="8" rx="3" fill="#cf6856" stroke="#84493c" stroke-width="2" transform="rotate(13 80 25)"/>
</svg>
