  <rect x="2" y="3" width="54" height="39" rx="17" fill="#fffaf1" stroke="#506272" stroke-width="3"/>
  <circle cx="29" cy="22" r="13" fill="#df9a4d" stroke="#84552f" stroke-width="2"/>
  <g fill="#603d30">
    <circle cx="23" cy="19" r="2.7"/><circle cx="34" cy="16" r="2.4"/>
    <circle cx="29" cy="27" r="2.8"/><circle cx="37" cy="24" r="1.8"/>
  </g>
  <circle cx="17" cy="46" r="3" fill="#506272"/>
  <!-- The child's gaze leads to the empty jar -->
  <path d="M3 95q1-15 18-15t20 15" fill="#388890"/>
  <ellipse cx="21" cy="68" rx="16" ry="18" fill="#d79a74" stroke="#734b3c" stroke-width="2"/>
  <path d="M5 68q-5-16 8-19 18-6 24 9-11 4-19-2-3 8-13 12" fill="#4b322b"/>
  <g fill="#3b302d"><circle cx="20" cy="66" r="2.1"/><circle cx="32" cy="65" r="2.1"/></g>
  <path d="M21 78q4-5 10-2" fill="none" stroke="#674030" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M61 39h27v8q8 6 8 14v22q0 9-9 9H62q-9 0-9-9V61q0-8 8-14Z"
