<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Too</title>
  <desc>A hat fits above a child's eyes. A much larger hat slips down over both eyes: it is too big.</desc>
  <g stroke="#44383a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- The same face and hat colour make size the difference between the two examples. -->
    <path d="M5 82q3-13 15-13t16 13" fill="#e9a34b"/>
    <ellipse cx="20" cy="50" rx="13" ry="20" fill="#efbf91"/>
    <path d="M6 40q0-18 14-18t14 18" fill="#619bc9"/>
    <rect x="5" y="36" width="30" height="9" rx="4" fill="#4078a7"/>
    <path d="M14 51h1m10 0h1" stroke-width="3.5"/>
    <path d="M15 60q5 5 10 0" fill="none"/>
    <path d="M39 54h9m-5-5 5 5-5 5" fill="none" stroke="#546a76" stroke-width="3"/>

    <path d="M55 84q4-13 18-13t17 13" fill="#e9a34b"/>
    <ellipse cx="73" cy="54" rx="14" ry="20" fill="#efbf91"/>
    <path d="M51 52q0-31 21-33 23-2 24 33" fill="#619bc9"/>
    <path d="M51 49q22-4 44 0 3 0 3 4v6q0 3-4 2-22-3-43 1-3 0-3-3v-6q0-3 3-4Z" fill="#4078a7"/>
    <path d="M68 68q5-5 10 0" fill="none"/>
  </g>
</svg>
